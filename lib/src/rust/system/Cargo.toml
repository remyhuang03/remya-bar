[package]
name = "remya_bar_system"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"

chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2"
libloading = "0.8.9"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rusqlite = "0.41.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt"] }
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
