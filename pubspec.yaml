name: remya_bar
description: "A Material Design 3 Expressive bar for Hyprland on Linux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  flutter_rust_bridge: 2.13.0
  flutter_svg: ^2.3.0
  material_color_utilities: ^0.13.0
  remya_settings_client:
    path: ../remya_settings/packages/remya_settings_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/licenses/rust-dependencies.txt
    - assets/icons/media-artwork.png
    - assets/icons/media-live-dot.png
    - assets/icons/battery-card-status.png
    - assets/icons/resources/
    - assets/icons/datetime/
    - assets/icons/workspaces/
